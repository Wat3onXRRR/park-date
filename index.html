<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>游乐园 ♥ 调查表</title>
<style>
  :root{
    --ink:#3a3a3a;
    --ink2:#5d5d5d;
    --gray:#8f8f8f;
    --gray2:#bdbdbd;
    --line:#d2d2d2;
    --rose:#d4758f;
    --rose-d:#b95c76;
    --paper:#fffefe;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",SimSun,serif;
    color:var(--ink);
    background-color:#f2f2f2;
    background-image:
      repeating-linear-gradient(0deg, rgba(130,130,130,.16) 0 12px, rgba(255,255,255,0) 12px 26px),
      repeating-linear-gradient(90deg, rgba(130,130,130,.16) 0 12px, rgba(255,255,255,0) 12px 26px);
    min-height:100vh;
    padding:0 12px 70px;
  }

  /* ---------- 顶部状态条 ---------- */
  .bar{
    max-width:880px;margin:0 auto;padding:13px 4px 10px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:12.5px;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#6a6a6a;
  }
  .bar .row1{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
  .bar .row2{display:flex;gap:8px;flex:0 0 auto}
  .bar span#status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:8px;height:8px;border-radius:50%;background:#c9c9c9;flex:0 0 auto}
  .dot.on{background:#5aa469;box-shadow:0 0 0 3px rgba(90,164,105,.18)}
  .dot.warn{background:#d0a24a}
  .dot.bad{background:#c2606a}
  .bar .room{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:#555;
  }
  .bar button{
    font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;
    border:1px solid #9c9c9c;background:#fff;color:#4a4a4a;
  }
  .bar button:hover{background:#f3f3f3}
  .bar .sp{flex:1}

  /* ---------- 纸张 ---------- */
  .paper{
    position:relative;max-width:880px;margin:26px auto 0;
    background:var(--paper);
    border:2px solid #9a9a9a;border-radius:14px;
    box-shadow:0 16px 36px rgba(0,0,0,.10);
    padding:0 30px 26px;
  }

  /* 绶带 */
  .ribbon{
    position:absolute;left:50%;top:-46px;transform:translateX(-50%);
    width:min(58%,420px);min-width:250px;
    background:linear-gradient(180deg,#b3b3b3,#8e8e8e);
    color:#fff;text-align:center;padding:12px 16px 24px;
    clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);
    box-shadow:0 6px 14px rgba(0,0,0,.14);
    z-index:2;
  }
  .ribbon .script{
    font-family:"Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive;
    font-size:clamp(20px,3.4vw,30px);line-height:1.1;letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .ribbon .cn{
    font-size:clamp(15px,2.4vw,20px);letter-spacing:.34em;margin-top:6px;
    padding-left:.34em;font-weight:600;
  }
  .ribbon .cn .hh{color:#ffd7e2;letter-spacing:0;margin:0 2px}

  /* 头部 */
  .head{
    display:grid;grid-template-columns:150px 1fr 150px;gap:18px;align-items:center;
    padding-top:112px;
  }
  .photo{
    position:relative;width:150px;height:186px;background:#a5a5a5;
    clip-path:polygon(26% 0,74% 0,100% 20%,100% 80%,74% 100%,26% 100%,0 80%,0 20%);
  }
  .photo::before{
    content:"";position:absolute;inset:2px;background:#fff;clip-path:inherit;
  }
  .photo span{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:12px;color:#b0b0b0;letter-spacing:.2em;
    font-family:system-ui,"PingFang SC",sans-serif;
  }
  .photo.you{background:#6f6f6f}
  .photo.you span{color:#c8c8c8}

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
  .grp{display:flex;flex-direction:column;gap:11px;min-width:0}
  .gtag{font-size:11px;letter-spacing:.2em}
  .frow{display:flex;align-items:flex-end;gap:8px;font-size:16px}
  .frow .k{flex:0 0 auto;letter-spacing:.1em;color:var(--ink2)}
  .frow .v{flex:1;position:relative}
  .frow input{
    width:100%;border:0;border-bottom:1.4px dashed #a8a8a8;background:transparent;
    font:inherit;font-size:16px;color:var(--ink);padding:2px 4px 3px;outline:none;text-align:center;
  }
  .frow input:focus{border-bottom-color:#555}
  .frow .ro{
    display:block;text-align:center;border-bottom:1.4px dashed #c8c8c8;
    padding:2px 4px 3px;min-height:25px;color:var(--rose-d);font-size:16px;
  }
  .frow .ro:empty::before{content:"—";color:#dcdcdc}

  .whoTag{
    display:inline-block;font-size:11px;letter-spacing:.18em;padding:2px 9px;border-radius:99px;
    font-family:system-ui,"PingFang SC",sans-serif;
  }
  .whoTag.you{background:#3f3f3f;color:#fff}
  .whoTag.peer{background:var(--rose);color:#fff}

  @media (max-width:720px){
    .bar{padding:10px 2px 6px;gap:7px}
    .bar .row1{flex:1 1 100%}
    .bar .row2{flex:1 1 100%}
    .bar .row2 button{flex:1 1 0;white-space:nowrap;font-size:12px;padding:7px 2px}
    .bar .room{font-size:11px;letter-spacing:.06em;padding:2px 6px}
    .paper{margin-top:32px}
    .head{grid-template-columns:1fr;padding-top:96px;gap:10px}
    .photo{display:none}
    .fields{grid-template-columns:1fr 1fr;gap:4px 16px}
    .grp{gap:9px}
    .frow{font-size:14.5px}
    .frow input,.frow .ro{font-size:14.5px}
  }

  /* 分隔线 */
  .rule{
    display:flex;align-items:center;gap:10px;margin:26px 0 20px;color:var(--gray);
  }
  .rule::before,.rule::after{content:"";height:1.4px;background:#bcbcbc;flex:1;position:relative}
  .rule i{width:7px;height:7px;border:1.4px solid #9a9a9a;transform:rotate(45deg);display:block}

  h2.list{
    text-align:center;font-size:clamp(19px,3.2vw,26px);letter-spacing:.16em;
    font-weight:600;margin:0 0 18px;color:#4a4a4a;
    font-family:Georgia,"Songti SC",serif;
  }

  /* ---------- 清单 ---------- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 46px;position:relative}
  .cols::before{
    content:"";position:absolute;left:50%;top:2px;bottom:2px;
    border-left:1.4px dashed #c8c8c8;
  }
  .sec{margin-bottom:22px;break-inside:avoid}
  .sec-t{
    font-size:14px;letter-spacing:.14em;color:#555;margin:0 0 8px;
    display:flex;align-items:center;gap:7px;
  }
  .sec-t::before{content:"·";font-size:18px;line-height:1;color:#8a8a8a}
  .sec-t.right{justify-content:flex-end}
  .sec-t.right::before{order:2}

  .row{
    display:flex;gap:10px;align-items:flex-start;
    padding:5.5px 0;font-size:14.5px;line-height:1.5;color:#3f3f3f;
  }
  .row .txt{flex:1;letter-spacing:.02em}
  .row .txt em{font-style:normal;color:#9a9a9a;font-size:12px;margin-right:6px}
  .box{
    flex:0 0 auto;width:20px;height:20px;margin-top:3px;padding:0;
    border:1.4px solid #9a9a9a;border-radius:2px;background:#fff;
    display:grid;place-items:center;cursor:pointer;transition:background .12s,border-color .12s;
  }
  .box::after{
    content:"";width:9px;height:5px;margin-top:-2px;
    border-left:1.7px solid #fff;border-bottom:1.7px solid #fff;
    transform:rotate(-45deg);opacity:0;transition:opacity .1s;
  }
  .box.me{background:#3f3f3f;border-color:#3f3f3f}
  .box.peer{background:var(--rose);border-color:var(--rose)}
  .box.me::after,.box.peer::after{opacity:1}
  .box.both{
    background:linear-gradient(135deg,#3f3f3f 0 50%,var(--rose) 50% 100%);
    border-color:#8a7078;
  }
  .box.both::after{opacity:1}

  @media (max-width:720px){
    .paper{padding:0 16px 22px}
    .cols{grid-template-columns:1fr;gap:0}
    .cols::before{display:none}
    .row{font-size:14px}
  }

  /* ---------- 问答 ---------- */
  .asks{margin-top:26px;padding-top:18px;border-top:2px solid #e0e0e0}
  .ask{margin-bottom:16px}
  .ask .q{font-size:14.5px;color:#4a4a4a;margin-bottom:7px;letter-spacing:.03em}
  .ask .lines{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
  .ask .ln{display:flex;gap:8px;align-items:flex-end;font-size:14px}
  .ask .ln b{
    font-weight:600;color:#fff;background:#3f3f3f;font-size:11px;
    padding:1px 7px;border-radius:99px;font-family:system-ui,sans-serif;letter-spacing:.1em;
    margin-bottom:3px;
  }
  .ask .ln.peer b{background:var(--rose)}
  .ask input{
    flex:1;border:0;border-bottom:1.3px dashed #b4b4b4;background:transparent;
    font:inherit;font-size:14px;color:#333;padding:3px 4px;outline:none;min-width:0;
  }
  .ask input:focus{border-bottom-color:#555}
  .ask .ro{
    flex:1;border-bottom:1.3px dashed #c8c8c8;padding:3px 4px;min-height:24px;
    color:var(--rose-d);font-size:14px;word-break:break-word;
  }
  .ask .ro:empty::before{content:"—";color:#dcdcdc}
  @media (max-width:620px){
    .ask .lines{grid-template-columns:1fr;gap:6px}
  }

  /* ---------- 结果 ---------- */
  .result{
    margin-top:28px;border:1.6px solid #b6b6b6;border-radius:12px;
    padding:18px 18px 16px;background:#fbfbfb;
  }
  .result h3{
    margin:0 0 14px;font-size:16px;letter-spacing:.2em;color:#4a4a4a;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .result h3::after{content:"";flex:1;height:1.3px;background:#d5d5d5}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stats div{
    text-align:center;background:#fff;border:1.3px solid #dcdcdc;border-radius:9px;padding:10px 4px;
  }
  .stats b{display:block;font-size:24px;line-height:1.1;font-family:Georgia,serif;color:#3f3f3f}
  .stats span{display:block;font-size:11px;color:#8a8a8a;margin-top:5px;letter-spacing:.04em}
  .stats div.both b{color:#b0435f}
  .stats div.pme b{color:#3f3f3f}
  .stats div.ppeer b{color:var(--rose)}
  .stats div.none b{color:#b5b5b5}

  .ratio{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;color:#7a7a7a}
  .ratio .track{flex:1;height:9px;border-radius:99px;background:#e6e6e6;overflow:hidden;display:flex}
  .ratio .track i{display:block;height:100%}
  .ratio .track i.b{background:#b0435f}
  .ratio .track i.m{background:#6f6f6f}
  .ratio .track i.p{background:var(--rose)}

  .hitlist{display:flex;flex-wrap:wrap;gap:6px}
  .hitlist span{
    font-size:12px;background:#fff;border:1px solid #dcdcdc;border-radius:99px;
    padding:3px 10px;color:#555;
  }
  .hitlist.peer span{border-color:#f0cdd6;color:var(--rose-d);background:#fff7f9}
  .hitlist .none{color:#b0b0b0;border-style:dashed}
  .sub{font-size:12px;color:#9a9a9a;margin:14px 0 7px;letter-spacing:.1em}

  .sharebtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .sharebtn{
    flex:1 1 140px;height:46px;border-radius:99px;cursor:pointer;
    border:1.5px solid #4a4a4a;background:#fff;color:#3f3f3f;
    font:inherit;font-size:14px;letter-spacing:.08em;
    transition:.18s;
  }
  .sharebtn:hover{background:#f2f2f2}
  .sharebtn.primary{background:#3f3f3f;color:#fff;border-color:#3f3f3f}
  .sharebtn.primary:hover{background:#232323}

  .imgwrap{
    position:fixed;inset:0;background:rgba(20,20,20,.86);z-index:120;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .imgwrap img{max-width:100%;max-height:88vh;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .imgwrap .close{
    position:fixed;top:16px;right:20px;width:40px;height:40px;border-radius:50%;
    border:none;background:#fff;color:#333;font-size:20px;cursor:pointer;
  }
  .imgwrap .tip{
    position:fixed;top:22px;left:0;right:0;text-align:center;color:#fff;font-size:13px;
    letter-spacing:.1em;font-family:system-ui,"PingFang SC",sans-serif;
  }

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr)}
  }

  .foot{
    text-align:center;font-size:11px;color:#a8a8a8;margin-top:20px;letter-spacing:.1em;
    font-family:system-ui,"PingFang SC",sans-serif;
  }

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:#3f3f3f;color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;
    font-family:system-ui,"PingFang SC",sans-serif;letter-spacing:.02em;
    opacity:0;pointer-events:none;transition:.24s;z-index:99;
    box-shadow:0 10px 24px rgba(0,0,0,.24);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .hint{
    max-width:880px;margin:14px auto 0;font-size:12.5px;line-height:1.7;color:#7d7d7d;
    background:#fffdf5;border:1px solid #e8e0c8;border-radius:9px;padding:12px 14px;
    font-family:system-ui,"PingFang SC",sans-serif;
  }
  .hint b{color:#a06a2a;font-weight:600}
</style>
</head>
<body>

<div class="bar">
  <div class="row1">
    <span class="dot" id="dot"></span>
    <span id="status">正在连接…</span>
    <span class="sp"></span>
    <span class="room" id="room">房间 —</span>
  </div>
  <div class="row2">
    <button id="btnLink">复制邀请链接</button>
    <button id="btnCopy">复制我的答案</button>
    <button id="btnClear">清空我的</button>
  </div>
</div>

<div class="paper">
  <div class="ribbon">
    <div class="script">Amusement<br>Park Date</div>
    <div class="cn">游乐园 <span class="hh">♥</span> 调查表</div>
  </div>

  <div class="head">
    <div class="photo you"><span>你</span></div>
    <div class="fields" id="fields"></div>
    <div class="photo"><span>TA</span></div>
  </div>

  <div class="rule"><i></i></div>
  <h2 class="list">RELATIONSHIP CHECKLIST</h2>

  <div class="cols">
    <div class="col" id="colL"></div>
    <div class="col" id="colR"></div>
  </div>

  <div class="asks" id="asks"></div>

  <div class="result">
    <h3>你们的对照</h3>
    <div class="stats">
      <div class="both"><b id="nBoth">0</b><span>两个人都勾了</span></div>
      <div class="pme"><b id="nMe">0</b><span>只有你</span></div>
      <div class="ppeer"><b id="nPeer">0</b><span>只有 TA</span></div>
      <div class="none"><b id="nNone">0</b><span>谁都没勾</span></div>
    </div>
    <div class="ratio">
      <span>默契度</span>
      <div class="track"><i class="b" id="barB"></i><i class="m" id="barM"></i><i class="p" id="barP"></i></div>
      <span id="ratioTxt">0%</span>
    </div>
    <div class="sub">两个人都勾了</div>
    <div class="hitlist" id="hitBoth"><span class="none">还没有重合的项目</span></div>
    <div class="sub">只有 TA 勾了</div>
    <div class="hitlist peer" id="hitPeer"><span class="none">TA 还没开始填</span></div>

    <div class="sharebtns">
      <button class="sharebtn primary" id="btnShare">生成分享图</button>
      <button class="sharebtn" id="btnShareLink">复制结果文字</button>
    </div>
  </div>

  <div class="foot">Amusement Park Date · 两个人各自打开，勾自己那一栏</div>
</div>

<div class="hint" id="hint" style="display:none"></div>

<script>
(function(){
"use strict";

/* ================= 数据 ================= */

var SECTIONS = [
  { title:'关于出发', side:'l', items:[
    '提议一起去游乐园的人',
    '负责提前做好游玩攻略的人',
    '前一天晚上兴奋到睡不着的人',
    '出门前花更长时间打扮的人',
    '提议穿情侣装去游乐园的人',
    '会拿游乐园纸质地图的人',
    '负责拎包或拿东西的人',
    '一进园就迷失方向分不清路的人',
    '排队无聊时找话题解闷的人',
    '带了相机专门给对方拍照的人'
  ]},
  { title:'关于休整', side:'l', items:[
    '最先喊饿要去吃东西的人',
    '提出找张长椅坐下歇会的人',
    '吃东西弄到脸上需要对方擦的人',
    '对方双手拿满食物时帮忙喂水的人',
    '看到园区人偶想要合影的人',
    '害羞不敢靠近人偶被对方推过去的人',
    '买到好吃的第一口喂给对方的人',
    '嫌弃幼稚但还是会戴上头箍的人',
    '给对方挑选成对小挂件的人',
    '负责掏钱买单的人',
    '指挥对方摆姿势拍照的人',
    '对方犹豫时直接帮对方买下来的人',
    '对着花车上的演员挥手互动的人',
    '走累了整个人挂在对方身上的人'
  ]},
  { title:'关于游乐', side:'r', items:[
    '非要拉着对方去玩刺激项目的人',
    '设施启动前一秒反悔想要下去的人',
    '在刺激项目上闭眼尖叫的人',
    '在刺激项目上全程面不改色的人',
    '在下面帮对方拿包等待的人',
    '遇到高空项目死活不肯玩的人',
    '只想玩儿童设施的人',
    '某原因坐激流勇进全身湿透的人',
    '坐海盗船专挑两端最高处坐的人',
    '玩碰碰车专门追着对方撞的人',
    '玩旋转咖啡杯把盘子转飞快的人',
    '坐旋转木马时一直看着对方的人',
    '坐空中脚踏车时卖力蹬车的人',
    '划脚踏船时在旁边偷懒的人',
    '玩游戏胜负欲太强跟对方较劲的人',
    '玩射击赢下奖品送给对方的人',
    '在摩天轮升到最高处想接吻的人',
    '只要与对方一起玩什么都可以的人'
  ]},
  { title:'关于末尾', side:'r', items:[
    '人群拥挤时紧紧牵住对方手的人',
    '降温时把自己外套脱给对方穿的人',
    '对着漫天烟花认真许愿的人',
    '烟花绽放时偷看对方侧脸的人',
    '提出下次再一起去游乐园的人',
    '看对方开心自己也忍不住笑的人'
  ]}
];

var ASKS = [
  '最喜欢的游乐项目是？',
  '不想再体验第二次的游乐项目是？',
  '下次还想和对方一起去的地方是？',
  '此时此刻想与对方说的一句话是？'
];

var ITEMS = [];
SECTIONS.forEach(function(sec, si){
  sec.items.forEach(function(t){ ITEMS.push({ text:t, sec:si }); });
});
var N = ITEMS.length;

/* ================= 工具 ================= */

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var toastEl = null, toastTimer = 0;
function toast(msg){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2200);
}

function copyText(text){
  return new Promise(function(resolve, reject){
    function legacy(){
      var ok = false;
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e){ ok = false; }
      ok ? resolve() : reject(new Error('copy failed'));
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(resolve, legacy);
    } else {
      legacy();
    }
  });
}

function packBits(arr){
  var bytes = new Uint8Array(Math.ceil(arr.length / 8));
  for(var i=0;i<arr.length;i++){ if(arr[i]) bytes[i>>3] |= (1 << (7 - (i & 7))); }
  var s = '';
  for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
  return btoa(s);
}
function unpackBits(str, n){
  var out = new Array(n).fill(0);
  if(!str) return out;
  try{
    var bin = atob(str);
    for(var i=0;i<n;i++){
      var b = bin.charCodeAt(i>>3) || 0;
      out[i] = (b >> (7 - (i & 7))) & 1;
    }
  }catch(e){}
  return out;
}

/* ================= 极简 MQTT over WebSocket ================= */

var enc = new TextEncoder();
var dec = new TextDecoder();

function cat(list){
  var len = 0, i;
  for(i=0;i<list.length;i++) len += list[i].length;
  var out = new Uint8Array(len), o = 0;
  for(i=0;i<list.length;i++){ out.set(list[i], o); o += list[i].length; }
  return out;
}
function encStr(s){
  var b = enc.encode(s);
  var head = new Uint8Array(2);
  head[0] = (b.length >> 8) & 255;
  head[1] = b.length & 255;
  return cat([head, b]);
}
function encLen(len){
  var out = [];
  do {
    var d = len % 128;
    len = Math.floor(len / 128);
    if(len > 0) d |= 128;
    out.push(d);
  } while(len > 0);
  return new Uint8Array(out);
}

function MqttClient(url, clientId){
  this.url = url;
  this.clientId = clientId;
  this.ws = null;
  this.buf = new Uint8Array(0);
  this.connected = false;
  this.closed = false;
  this.onConnect = null;
  this.onMessage = null;
  this.onClose = null;
}

MqttClient.prototype.open = function(){
  var self = this;
  var ws;
  try { ws = new WebSocket(this.url, 'mqtt'); }
  catch(e){ this.dead(); return; }
  ws.binaryType = 'arraybuffer';
  this.ws = ws;
  ws.onopen = function(){ self.raw(self.connectPacket()); };
  ws.onmessage = function(ev){ self.feed(new Uint8Array(ev.data)); };
  ws.onerror = function(){ self.dead(); };
  ws.onclose = function(){ self.dead(); };
};

MqttClient.prototype.dead = function(){
  if(this.closed) return;
  this.closed = true;
  this.connected = false;
  if(this.onClose) this.onClose();
};

MqttClient.prototype.close = function(){
  this.closed = true;
  if(this.ws){
    try { this.ws.onclose = null; this.ws.close(); } catch(e){}
  }
};

MqttClient.prototype.raw = function(bytes){
  if(this.ws && this.ws.readyState === 1) this.ws.send(bytes);
};

MqttClient.prototype.connectPacket = function(){
  var vh = cat([encStr('MQTT'), new Uint8Array([4, 0x02, 0x00, 0x3C])]);
  var body = cat([vh, encStr(this.clientId)]);
  return cat([new Uint8Array([0x10]), encLen(body.length), body]);
};

MqttClient.prototype.subscribe = function(filter, pid){
  pid = pid || 1;
  var body = cat([new Uint8Array([(pid >> 8) & 255, pid & 255]), encStr(filter), new Uint8Array([0])]);
  this.raw(cat([new Uint8Array([0x82]), encLen(body.length), body]));
};

MqttClient.prototype.publish = function(topic, payload, retain){
  var body = cat([encStr(topic), enc.encode(payload)]);
  this.raw(cat([new Uint8Array([0x30 | (retain ? 1 : 0)]), encLen(body.length), body]));
};

MqttClient.prototype.ping = function(){
  this.raw(new Uint8Array([0xC0, 0x00]));
};

MqttClient.prototype.feed = function(chunk){
  this.buf = cat([this.buf, chunk]);
  for(;;){
    if(this.buf.length < 2) return;
    var mul = 1, len = 0, i = 1, digit;
    do {
      if(i >= this.buf.length) return;
      digit = this.buf[i++];
      len += (digit & 127) * mul;
      mul *= 128;
      if(mul > 2097152) { this.dead(); return; }
    } while(digit & 128);
    if(this.buf.length < i + len) return;

    var type = this.buf[0] >> 4;
    var flags = this.buf[0] & 15;
    var body = this.buf.subarray(i, i + len);
    this.buf = this.buf.subarray(i + len);

    if(type === 2){
      if(body[1] === 0){
        this.connected = true;
        if(this.onConnect) this.onConnect();
      } else {
        this.dead();
      }
    } else if(type === 3){
      var qos = (flags >> 1) & 3;
      var p = 0;
      if(qos > 0) p += 2;
      if(body.length < p + 2) continue;
      var tl = (body[p] << 8) | body[p+1];
      p += 2;
      if(body.length < p + tl) continue;
      var topic = dec.decode(body.subarray(p, p + tl));
      p += tl;
      var payload = dec.decode(body.subarray(p));
      if(this.onMessage) this.onMessage(topic, payload);
    }
  }
};

  for(var i=0;i<N;i++){

}

function publish(force){
  if(!mq || !mq.connected) return;
  var payload = JSON.stringify({
    n: me.name, h: me.height, a: me.age,
    b: packBits(me.ans), q: me.asks, t: Date.now()
  });
  mq.publish(TOPIC_ROOT + room + '/s/' + myId, payload, true);
}

var pubTimer = 0;
function schedulePublish(){
  clearTimeout(pubTimer);
  pubTimer = setTimeout(publish, 260);
}

function setStatus(kind, text){
  var d = $('dot');
  d.className = 'dot' + (kind ? ' ' + kind : '');

function connectNext(){
  if(brokerIdx >= BROKERS.length){
    linkState = 'failed';
    setStatus('bad', '连不上实时服务器，20 秒后重试');
    showHint();
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){
      brokerIdx = 0;
      connectNext();
    }, 20000);
    return;
  }
  if(retryTimer){ clearTimeout(retryTimer); retryTimer = 0; }
  var url = BROKERS[brokerIdx];
  var c = new MqttClient(url, myId);
  var settled = false;
  var timer = setTimeout(function(){
    if(settled) return;
    settled = true;
    c.close();
    brokerIdx++;
    connectNext();
  }, 6000);

  c.onConnect = function(){
    if(settled) return;
    settled = true;
    clearTimeout(timer);
    mq = c;
    linkState = 'on';
    c.subscribe(TOPIC_ROOT + room + '/s/+', 1);
    hideHint();
    setTimeout(function(){ publish(true); }, 120);
    setStatus('on', '已连线');
    clearInterval(hbTimer);
    hbTimer = setInterval(function(){ publish(); }, 12000);
  };
  c.onMessage = function(topic, payload){
    var sid = topic.slice(topic.lastIndexOf('/') + 1);
    if(sid === myId) return;
    var data;
    try { data = JSON.parse(payload); } catch(e){ return; }
    if(!data || typeof data !== 'object') return;
    peerId = sid;
    peer = {
      name: data.n || '',
      height: data.h || '',
      age: data.a || '',
      ans: unpackBits(data.b, N),
      asks: Array.isArray(data.q) ? data.q : ['','','','']
    };
    peerTs = Date.now();
    paintAll();
    paintPresence();
  };
  c.onClose = function(){
    if(settled) return;
    settled = true;
    clearTimeout(timer);
    brokerIdx++;
    connectNext();
  };
  setStatus('', '正在连接 ' + (brokerIdx + 1) + '/' + BROKERS.length + '…');
  c.open();
}

function rrect(c, x, y, w, h, r){
  c.beginPath();

  c.arcTo(x + w, y + h, x, y + h, r);

function wrapPx(c, text, maxW){

    if(cur && c.measureText(cur + ch).width > maxW){ out.push(cur); cur = ch; }
    else cur += ch;
  }
  if(cur) out.push(cur);

}
function textSpaced(c, t, cx, y, sp, align){
  var ws = [], total = 0, i;
  for(i = 0; i < t.length; i++){ var w = c.measureText(t.charAt(i)).width; ws.push(w); total += w + sp; }
  total -= sp;
  var x = align === 'left' ? cx : (align === 'right' ? cx - total : cx - total / 2);
  c.textAlign = 'left';
  for(i = 0; i < t.length; i++){ c.fillText(t.charAt(i), x, y); x += ws[i] + sp; }
}
function tick(c, x, y, on, who){
  var s = 13, r = 2.6;
  rrect(c, x, y, s, s, r);
  if(!on){
    c.lineWidth = 1.5; c.strokeStyle = '#b8b8b8'; c.stroke();
    return;
  }
  c.fillStyle = who === 'peer' ? PF.rose : PF.ink;
  c.fill();
  if(who === 'both'){
    c.beginPath(); c.moveTo(x + s, y); c.lineTo(x + s, y + s); c.lineTo(x, y + s);
    c.closePath(); c.fillStyle = PF.rose; c.fill();
  }
}

function buildPosterCanvas(){
  var W = PF.W, pad = PF.pad, colW = 230, gap = 12;
  var colX = [pad, pad + colW + gap];
  var cw = W - pad * 2;

  var canvas = document.createElement('canvas');
  canvas.width = W * PF.S; canvas.height = 3400 * PF.S;
  var c = canvas.getContext('2d');
  c.scale(PF.S, PF.S);
  c.textBaseline = 'top';
  c.fillStyle = '#fff';
  c.fillRect(0, 0, W, 3400);

  var meas = document.createElement('canvas').getContext('2d');

  /* --- 两栏的行 --- */
  function buildCol(side){
    var rows = [], last = -1;
    for(var i = 0; i < N; i++){
      var si = ITEMS[i].sec;
      if(SECTIONS[si].side !== side) continue;
      if(si !== last){ last = si; rows.push({t:'sec', txt:SECTIONS[si].title}); }
      rows.push({t:'item', txt:ITEMS[i].text, i:i});
    }
    return rows;
  }
  var cols = [buildCol('l'), buildCol('r')];
  var boxW = 13, boxGap = 5, txtW = colW - (boxW * 2 + boxGap) - 12, LH = 16.5;
  cols.forEach(function(rows){
    rows.forEach(function(r){
      if(r.t === 'sec'){ r.lines = [r.txt]; r.h = 31; return; }
      px(meas, 12, 0);
      r.lines = wrapPx(meas, r.txt, txtW);
      r.h = r.lines.length * LH + 6.5;
    });
  });

  var y = pad + 4;

  /* --- 页眉 --- */
  px(c, 10.5, 1, SANS); c.fillStyle = PF.sub;
  textSpaced(c, 'AMUSEMENT PARK DATE', W / 2, y, 2.6); y += 20;

  px(c, 29, 1, SERIF); c.fillStyle = PF.ink;
  textSpaced(c, '游乐园', W / 2 - 26, y, 3, 'right');
  c.fillStyle = PF.rose;
  textSpaced(c, '♥', W / 2, y + 1, 0);
  c.fillStyle = PF.ink;
  textSpaced(c, '调查表', W / 2 + 26, y, 3, 'left');
  y += 40;

  px(c, 9, 1, SANS); c.fillStyle = PF.faint;
  textSpaced(c, 'RELATIONSHIP CHECKLIST', W / 2, y, 3.2); y += 26;

  /* --- 两个人 --- */
  var nmMe = (me.name && me.name.trim()) ? me.name.trim() : '你';
  var nmPeer = (peer && peer.name && peer.name.trim()) ? peer.name.trim() : (peer ? 'TA' : '还没填');
  function tag(x, label, name, color, alignRight){
    px(c, 9.5, 1, SANS);
    var tw = c.measureText(label).width + 12;
    px(c, 12.5, 1, SANS);
    var nw = Math.min(c.measureText(name).width, 92);
    var total = tw + 8 + nw;
    var sx = alignRight ? x - total : x;
    px(c, 9.5, 1, SANS);
    c.fillStyle = color;
    rrect(c, sx, y, tw, 17, 8.5); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center';
    c.fillText(label, sx + tw / 2, y + 4.5);
    c.textAlign = 'left';
    px(c, 12.5, 1, SANS);
    c.fillStyle = color === PF.ink ? PF.ink : PF.deep;
    var nm = name;
    while(nm.length > 1 && c.measureText(nm).width > 92) nm = nm.slice(0, -1);
    c.fillText(nm, sx + tw + 8, y + 1.5);
  }
  tag(W / 2 - 14, '你', nmMe, PF.ink, true);
  tag(W / 2 + 14, 'TA', nmPeer, PF.rose, false);
  y += 34;

  /* --- 统计四格 --- */
  var s = stats();
  var union = s.both + s.me + s.peer;
  var ratio = union ? Math.round(s.both / union * 100) : 0;
  var cells = [
    ['两个人都勾了', s.both, PF.deep],
    ['只有你', s.me, PF.ink],
    ['只有 TA', s.peer, PF.rose],
    ['谁都没勾', s.none, '#b5b5b5']
  ];
  var bw = (cw - 3 * 8) / 4, bh = 62;
  cells.forEach(function(cell, k){
    var bx = pad + k * (bw + 8);
    rrect(c, bx, y, bw, bh, 8);
    c.fillStyle = '#fafafa'; c.fill();
    c.lineWidth = 1.2; c.strokeStyle = '#e0e0e0'; c.stroke();
    px(c, 21, 1, SERIF); c.fillStyle = cell[2]; c.textAlign = 'center';
    c.fillText(String(cell[1]), bx + bw / 2, y + 12);
    px(c, 9, 0, SANS); c.fillStyle = PF.sub;
    c.fillText(cell[0], bx + bw / 2, y + 42);
    c.textAlign = 'left';
  });
  y += bh + 18;

  /* --- 默契度 --- */
  px(c, 11, 0, SANS); c.fillStyle = PF.sub;
  c.fillText('默契度', pad, y + 4);
  px(c, 30, 1, SERIF); c.fillStyle = PF.deep; c.textAlign = 'right';
  c.fillText(ratio + '%', pad + cw, y - 6);
  c.textAlign = 'left';
  y += 34;
  var trW = cw, segs = [
    [s.both, PF.deep], [s.me, '#6f6f6f'], [s.peer, '#e6b3c1']
  ];
  c.fillStyle = '#eaeaea';
  rrect(c, pad, y, trW, 8, 4); c.fill();
  var sx2 = pad;
  segs.forEach(function(sg){
    if(!sg[0]) return;
    var w = sg[0] / N * trW;
    c.save();
    rrect(c, pad, y, trW, 8, 4); c.clip();
    c.fillStyle = sg[1]; c.fillRect(sx2, y, w, 8);
    c.restore();
    sx2 += w;
  });
  y += 30;

  /* --- 清单 --- */
  var listTop = y, maxColH = 0;
  cols.forEach(function(rows, ci){
    var x = colX[ci], cy = listTop;
    rows.forEach(function(r){
      if(r.t === 'sec'){
        c.fillStyle = PF.ink;
        c.beginPath(); c.arc(x + 2.5, cy + 8.5, 1.8, 0, 6.3); c.fill();
        px(c, 11, 1, SANS); c.fillStyle = PF.ink;
        textSpaced(c, r.txt, x + 10, cy + 2, 1.4, 'left');
        cy += r.h;
        return;
      }
      px(c, 12, 0, SANS); c.fillStyle = '#5c5c5c';
      for(var L = 0; L < r.lines.length; L++){
        c.fillText(r.lines[L], x, cy + 1 + L * LH);
      }
      var m = !!me.ans[r.i], p = !!peerAns(r.i);
      var bx = x + colW - (boxW * 2 + boxGap);
      if(m && p) tick(c, bx, cy + 2, true, 'both');
      else tick(c, bx, cy + 2, m, 'me');
      tick(c, bx + boxW + boxGap, cy + 2, p, 'peer');
      cy += r.h;
    });
    if(cy - listTop > maxColH) maxColH = cy - listTop;
  });
  y = listTop + maxColH + 24;

  /* --- 四问 --- */
  px(c, 10.5, 1, SANS); c.fillStyle = PF.faint;
  textSpaced(c, 'FINALLY', pad, y, 3, 'left');
  y += 22;
  ASKS.forEach(function(q, k){
    px(c, 12, 1, SANS); c.fillStyle = PF.ink;
    var ql = wrapPx(c, q, cw);
    ql.forEach(function(line, li){ c.fillText(line, pad, y + li * 17); });
    y += ql.length * 17 + 3;

    function pair(label, val, color){
      if(!val || !val.trim()) return 0;
      px(c, 11.5, 0, SANS);
      var pre = label + '  ';
      var pw = c.measureText(pre).width;
      var ls = wrapPx(c, val.trim(), cw - pw - 2);
      for(var li2 = 0; li2 < ls.length; li2++){
        if(li2 === 0){ px(c, 10.5, 1, SANS); c.fillStyle = color; c.fillText(label, pad, y + 2); }
        px(c, 11.5, 0, SANS); c.fillStyle = '#5c5c5c';
        c.fillText(ls[li2], pad + pw, y);
        y += 16.5;
      }
      y += 2;
      return ls.length;
    }
    var a1 = me.asks[k] || '';
    var a2 = (peer && peer.asks && peer.asks[k]) ? peer.asks[k] : '';
    pair('你', a1, PF.ink);
    pair('TA', a2, PF.rose);
    if(!a1 && !a2){
      px(c, 11, 0, SANS); c.fillStyle = '#bdbdbd';
      c.fillText('（还没填）', pad, y);
      y += 16.5;
    }
    y += 10;
  });

  /* --- 页脚 --- */
  y += 6;
  c.strokeStyle = PF.line; c.lineWidth = 1;
  c.beginPath(); c.moveTo(pad, y); c.lineTo(W - pad, y); c.stroke();
  y += 14;
  px(c, 9.5, 0, SANS); c.fillStyle = PF.sub;
  var d = new Date();
  var ds = d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + ('0' + d.getDate()).slice(-2);
  var site = location.protocol === 'file:' ? '游乐园 ♥ 调查表' : location.host + location.pathname;
  c.fillText(site, pad, y);
  c.textAlign = 'right';
  c.fillText(ds, W - pad, y);
  c.textAlign = 'left';
  y += 24;

  /* --- 裁掉多余的空白 --- */
  var usedH = Math.ceil(y + pad);
  var out = document.createElement('canvas');
  out.width = W * PF.S; out.height = usedH * PF.S;
  var oc = out.getContext('2d');
  oc.fillStyle = '#fff'; oc.fillRect(0, 0, out.width, out.height);
  oc.drawImage(canvas, 0, 0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

function showImage(url){
  var wrap = document.createElement('div');
  wrap.className = 'imgwrap';
  var tip = document.createElement('div');
  tip.className = 'tip';
  tip.textContent = '长按或右键保存这张图';
  var img = document.createElement('img');
  img.src = url;
  var btn = document.createElement('button');
  btn.className = 'close';
  btn.textContent = '×';
  btn.onclick = function(){ document.body.removeChild(wrap); };
  wrap.appendChild(tip); wrap.appendChild(img); wrap.appendChild(btn);
  wrap.addEventListener('click', function(e){ if(e.target === wrap) document.body.removeChild(wrap); });
  document.body.appendChild(wrap);
}

function savePoster(){
  var cv = buildPosterCanvas();
  var url = cv.toDataURL('image/png');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS){ showImage(url); return; }
  var d = new Date();
  var name = '游乐园调查表-' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.png';
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 100);
  toast('分享图已生成，正在下载');
}

function resultText(){
  var s = stats();
  var union = s.both + s.me + s.peer;
  var ratio = union ? Math.round(s.both / union * 100) : 0;
  var nmMe = (me.name && me.name.trim()) ? me.name.trim() : '你';
  var nmPeer = (peer && peer.name && peer.name.trim()) ? peer.name.trim() : 'TA';
  var L = [];
  L.push('游乐园 ♥ 调查表 · 两个人的对照');
  L.push(nmMe + ' / ' + nmPeer + ' · 默契度 ' + ratio + '%');
  L.push('两个人都勾了 ' + s.both + ' 项，只有你 ' + s.me + ' 项，只有 TA ' + s.peer + ' 项');
  var both = [], op = [];
  for(var i = 0; i < N; i++){
    var m = !!me.ans[i], p = !!peerAns(i);
    if(m && p) both.push(ITEMS[i].text);
    else if(p) op.push(ITEMS[i].text);
  }
  if(both.length){ L.push(''); L.push('【都勾了】'); both.forEach(function(t){ L.push('· ' + t); }); }
  if(op.length){ L.push(''); L.push('【只有 TA】'); op.forEach(function(t){ L.push('· ' + t); }); }
  var qa = [];
  ASKS.forEach(function(q, i){
    var a = me.asks[i] || '', b = (peer && peer.asks && peer.asks[i]) ? peer.asks[i] : '';
    if(a || b) qa.push(q + '\n  ' + nmMe + '：' + (a || '—') + '\n  ' + nmPeer + '：' + (b || '—'));
  });
  if(qa.length){ L.push(''); L.push(qa.join('\n')); }
  return L.join('\n');
}

$('btnShare').addEventListener('click', function(){
  try { savePoster(); }
  catch(err){ toast('生成失败：' + err.message); }
});

$('btnShareLink').addEventListener('click', function(){
  var txt = resultText();
  copyText(txt).then(function(){
    toast('结果文字已复制');
  }).catch(function(){
    showText('结果', txt);
  });
});

/* ================= 启动 ================= */

paintAll();
paintPresence();
presenceTimer = setInterval(paintPresence, 4000);

if(location.protocol === 'file:'){
  setStatus('warn', '本地打开，只有你自己能看到');
  var h = $('hint');
  h.style.display = 'block';
  h.innerHTML = '<b>这是本地文件。</b>填是能填，但两个人在线同步要把它挂到网上（GitHub Pages 免费）。' +
                '部署好之后，把带房间号的链接发给对方，两边就能同时填。';
} else {
  connectNext();
}

})();
